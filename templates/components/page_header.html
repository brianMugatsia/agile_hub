<header class="page-header">
  <div class="page-header__text">
    {% include "partials/breadcrumbs.html" %}
    <h1 class="page-header__title">{{ title|default:page_title }}</h1>
    {% if subtitle %}<p class="page-header__sub">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_url %}<div class="page-header__actions"><a class="btn btn--primary" href="{{ action_url }}">{{ action_label|default:"Add record" }}</a></div>{% endif %}
</header>
