{% extends "base_print.html" %}

{% block content %}
  <section class="card">
    <div class="card__body">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              {% for column in columns %}
                <th>{{ column.label }}</th>
              {% endfor %}
            </tr>
          </thead>
          <tbody>
            {% for row_cells in rows %}
              <tr>
                {% for cell in row_cells %}
                  <td>{{ cell }}</td>
                {% endfor %}
              </tr>
            {% empty %}
              <tr>
                <td colspan="{{ columns|length }}" class="text-muted text-center">No records found.</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </section>
{% endblock %}
