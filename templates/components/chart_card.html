<article class="card chart-card">
  <div class="card__header" style="display: flex; align-items: center; justify-content: space-between;">
    <h2 class="card__title">{{ title|default:"Performance" }}</h2>
    <span class="badge badge--positive" style="font-size: 0.72rem;">Live Metrics</span>
  </div>
  <div class="card__body chart-card__body" style="padding: 1.5rem;">
    {% if chart_data %}
      <div class="chart-grid">
        {% for point in chart_data %}
          <div class="chart-bar-column" title="{{ point.label }}: {{ point.value }}">
            <span class="chart-bar-value">{{ point.value }}</span>
            <div class="chart-bar-fill" style="height: {{ point.pct|default:50 }}%; --i: {{ forloop.counter0 }};"></div>
            <span class="chart-bar-label">{{ point.label }}</span>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="chart-empty">
        <p>{{ empty_message|default:"Chart data will appear when records are available." }}</p>
      </div>
    {% endif %}
  </div>
</article>
