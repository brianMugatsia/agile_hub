{% extends "base.html" %}
{% block content %}
  <section class="card card--narrow"><div class="card__body stack">
    <h2>Approve commission</h2>
    <p>Confirm approval of {{ commission }}. Payment remains a separate authorized action.</p>
    <form method="post" data-confirm-action="commission">{% csrf_token %}
      <button class="btn btn--primary" type="submit">Approve commission</button>
      <a class="btn btn--secondary" href="{% url 'commissions:list' %}">Cancel</a>
    </form>
  </div></section>
{% endblock %}
