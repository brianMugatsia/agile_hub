{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="dash">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="com-i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6"/><path d="M15 9l-6 6"/></symbol>
  </svg>

  <section class="card com-confirm" data-tone="reject" data-spot>
    <div class="card__body">
      <span class="com-confirm__icon" aria-hidden="true"><svg class="dash-icon"><use href="#com-i-x"/></svg></span>
      <span class="com-confirm__eyebrow">Confirmation required</span>
      <h2 class="com-confirm__title">Reject commission</h2>
      <p class="com-confirm__text">Provide a reason for rejecting {{ commission }}. This decision is recorded.</p>
      <form method="post" data-confirm-action="commission" class="com-confirm__form">{% csrf_token %}
        <div class="com-confirm__fields">
          {% if form %}{{ form.as_p }}{% else %}<label class="field"><span class="field__label">Reason</span><textarea class="textarea" name="reason" required maxlength="1000"></textarea></label>{% endif %}
        </div>
        <div class="com-confirm__actions">
          <button class="btn btn--danger" type="submit">Reject commission</button>
          <a class="btn btn--secondary" href="{% url 'commissions:list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </section>

</div>
<script type="module" src="{% static 'js/pages/dashboard-motion.js' %}"></script>
{% endblock %}
