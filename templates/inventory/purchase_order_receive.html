{% extends "base.html" %}

{% block content %}
  <section class="card card--wide">
    <div class="card__body stack">
      <p>Order #{{ order.pk }} · {{ order.supplier.name }} · {{ order.hub.name }}</p>
      <form method="post" class="stack">
        {% csrf_token %}
        {% for field in form %}
          {% include "components/form_field.html" with field=field %}
        {% endfor %}
        <div class="cluster">
          <button class="btn btn--primary" type="submit">Record received stock</button>
          <a class="btn btn--ghost" href="{% url 'inventory:purchase_orders' %}">Back to orders</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
