{% extends "base.html" %}
{% block content %}
  <section class="card card--narrow"><div class="card__body stack">
    <h2>Refund completed sale</h2>
    <p>This restores sale quantities to hub stock and records a refund outflow.</p>
    <p>{{ sale }} · {{ sale.total }}</p>
    <form method="post" data-validate data-loading>{% csrf_token %}
      {% if form %}{{ form.as_p }}{% else %}<label class="field"><span class="field__label">Reason</span><textarea class="textarea" name="reason" required maxlength="1000"></textarea></label>{% endif %}
      <button class="btn btn--danger" type="submit">Issue refund</button>
      <a class="btn btn--secondary" href="{% url 'sales:list' %}">Go back</a>
    </form>
  </div></section>
{% endblock %}
