{% load ui_tags %}
<div class="empty-state" role="status">
  <span class="empty-state__icon">{% icon "inbox" %}</span>
  <h2 class="empty-state__title">{{ title|default:"No records yet" }}</h2>
  <p class="empty-state__text">{{ message|default:"There is nothing to show here right now." }}</p>
</div>
