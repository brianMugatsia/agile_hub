{% extends "base_auth.html" %}
{% load ui_tags %}
{% block title %}Password updated{% endblock %}
{% block auth_content %}
  <div class="auth-card__icon">{% icon "check-circle" %}</div>
  <h1 class="auth-card__title">Password updated</h1>
  <p class="auth-card__lead">You can now sign in with your new password.</p>
  <a class="btn btn--primary btn--block" href="{% url 'accounts:login' %}">Sign in</a>
{% endblock %}
