{% extends "base_auth.html" %}
{% load ui_tags %}
{% block title %}Check your email{% endblock %}
{% block auth_content %}
  <div class="auth-card__icon">{% icon "inbox" %}</div>
  <h1 class="auth-card__title">Check your email</h1>
  <p class="auth-card__lead">
    If an account exists for that address, a reset link is on its way. It may take a minute to arrive.
  </p>
  <a class="btn btn--block" href="{% url 'accounts:login' %}">Back to sign in</a>
{% endblock %}
