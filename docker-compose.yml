version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: agile_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agile_hub}
      POSTGRES_USER: ${DB_USER:-agile_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agile_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agile_user} -d ${DB_NAME:-agile_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agile_hub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agile_hub_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-django-insecure-replace-this-in-production-vault}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DB_NAME: ${DB_NAME:-agile_hub}
      DB_USER: ${DB_USER:-agile_user}
      DB_PASSWORD: ${DB_PASSWORD:-agile_secure_password}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      SECURE_SSL_REDIRECT: "False"  # Set to True when terminating TLS at reverse proxy
      USE_PROXY_SSL_HEADER: "True"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  logs_data:
